<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMETIME | EVO Sports</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style> *{box-sizing:border-box}body{margin:0;background:#08152e;color:white;font:15px Arial,sans-serif}header,footer{text-align:center;padding:24px;background:#102b60}main{max-width:1200px;margin:auto;padding:15px}section{background:#112344;padding:18px;margin-bottom:16px;border-radius:10px}h2,h3{color:#a9c7ff}input,select,button{padding:10px;margin:4px;border-radius:6px;font:inherit;max-width:100%}button{background:#2858a5;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin-top:8px}.hidden{display:none}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #34486c;text-align:center}.qualified{background:#164b3e}.fixture{padding:10px;border-bottom:1px solid #34486c}.score{width:65px}#message{color:#ffda85;white-space:pre-wrap;position:sticky;top:0;background:#112344;z-index:2} </style></head><body><header><h1>GAMETIME</h1><p>EVO SPORTS | TOURNAMENT LIVE</p></header><main><p id="message" role="status"></p><section><h2>Organiser access</h2><div id="login"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginButton">Log in</button><button id="forgotButton">Forgot password?</button></div><div id="resetPanel" class="hidden"><input id="newPassword" type="password" placeholder="New password"><input id="confirmPassword" type="password" placeholder="Confirm password"><button id="resetButton">Save new password</button></div><button id="logoutButton" class="hidden">Log out</button></section><section><h2>Competition</h2><select id="competition"></select><p id="summary"></p><div id="createPanel" class="hidden"><h3>Create competition</h3><label>Name <input id="competitionName" value="Champions Cup"></label><label>Format <select id="format"><option value="champions_league">Champions League</option><option value="groups">Groups and knockouts</option><option value="round_robin">Round-robin league</option><option value="knockout">Straight knockout</option></select></label><label>Teams <input id="teamCount" type="number" min="4" max="64" value="26"></label><label id="gamesLabel">Matches per team <input id="games" type="number" min="1" value="4"></label><label id="qualLabel">Knockout qualifiers <select id="qualifiers"><option>2</option><option>4</option><option selected>8</option><option>16</option><option>32</option><option>64</option></select></label><label id="groupLabel">Groups <input id="groups" type="number" min="2" value="2"></label><label id="perLabel">Qualifiers per group <input id="perGroup" type="number" min="1" value="2"></label><label id="doubleLabel"><input id="double" type="checkbox"> Double round-robin</label><label><input id="public" type="checkbox"> Public competition (leave unchecked for testing)</label><button id="createButton">Create competition</button></div></section><section id="admin" class="hidden"><h2>Competition management</h2><div id="teamEditor"></div><button id="saveTeams">Save team names</button><button id="drawButton">Generate fixtures</button><button id="knockoutButton">Generate knockout stages</button></section><section id="tableSection"><h2>Live standings</h2><div id="standings"></div></section><section id="leagueSection"><h2>League fixtures and results</h2><div id="fixtures"></div></section><section><h2>Knockout stages</h2><div id="knockouts"></div><h2 id="champion"></h2></section></main><footer>GAMETIME | Powered by EVO Sports</footer><script>
const SUPABASE_URL = "https://wfqvjqyghsirksdtlbnl.supabase.co";
const SUPABASE_KEY = "sb_publishable__vqVglfQV29KLglZdwDbhg_81SwhBPO";
const el=id=>document.getElementById(id); const message=t=>el('message').textContent=t;
let db,user=null,current=null,teams=[],matches=[],busy=false,recovering=false;
const check=r=>{if(r.error)throw r.error;return r.data};const owner=()=>!!(user&&current&&current.owner_id===user.id&&!recovering);const complete=m=>m.home_score!=null&&m.away_score!=null;const name=n=>teams.find(t=>t.team_number===n)?.name||'To be decided';const fmt=()=>current?.format||'champions_league';const power=n=>n>=2&&Number.isInteger(Math.log2(n));
async function action(fn){if(busy)return;busy=true;try{await fn()}catch(e){message(e.message||String(e))}finally{busy=false}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rounds(ids){let a=[...ids];if(a.length%2)a.push(null);let out=[];for(let r=0;r<a.length-1;r++){let p=[];for(let i=0;i<a.length/2;i++)if(a[i]!=null&&a[a.length-1-i]!=null)p.push([a[i],a[a.length-1-i]]);out.push(p);a.splice(1,0,a.pop())}return out}
function leagueDraw(ids,g){let n=ids.length;if(n%2===0)return shuffle(rounds(shuffle([...ids]))).slice(0,g);let a=shuffle([...ids]),out=[];for(let d=1;d<=g/2;d++){let edges=a.map((x,i)=>[x,a[(i+d)%n]]);for(let edge of edges){let slot=out.find(p=>p.every(e=>!e.includes(edge[0])&&!e.includes(edge[1])));if(!slot){slot=[];out.push(slot)}slot.push(edge)}}return out}
function ranking(group){let rows=teams.filter(t=>group==null||t.group_name===group).map(t=>({n:t.team_number,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));let map=new Map(rows.map(r=>[r.n,r]));for(let m of matches.filter(m=>m.stage==='league'&&complete(m))){let h=map.get(m.home_team),a=map.get(m.away_team);if(!h||!a)continue;h.p++;a.p++;h.gf+=m.home_score;h.ga+=m.away_score;a.gf+=m.away_score;a.ga+=m.home_score;if(m.home_score>m.away_score){h.w++;a.l++;h.pts+=3}else if(m.home_score<m.away_score){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}}return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||b.w-a.w||a.n-b.n)}
function node(tag,text,parent){let e=document.createElement(tag);if(text!=null)e.textContent=text;if(parent)parent.append(e);return e}
function groupNames(){return [...new Set(teams.map(t=>t.group_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))}
function renderStandings(){let root=el('standings');root.replaceChildren();for(let group of fmt()==='groups'?groupNames():[null]){if(group)node('h3',group,root);let wrap=node('div',null,root);wrap.className='scroll';let table=node('table',null,wrap),head=node('tr',null,table);for(let h of ['Pos','Team','P','W','D','L','GF','GA','GD','Pts'])node('th',h,head);ranking(group).forEach((r,i)=>{let tr=node('tr',null,table);if(i<(fmt()==='groups'?current.qualifiers_per_group:fmt()==='champions_league'?current.qualifiers:0))tr.className='qualified';for(let v of [i+1,name(r.n),r.p,r.w,r.d,r.l,r.gf,r.ga,r.gf-r.ga,r.pts])node('td',v,tr)})}}
function renderMatch(m,root){let row=node('div',null,root);row.className='fixture';node('div',`Match ${m.match_number} | ${name(m.home_team)} vs ${name(m.away_team)}`,row);if(m.is_bye)node('p','Bye — automatic progression',row);else if(owner()&&m.home_team&&m.away_team&&!(m.stage==='league'&&matches.some(x=>x.stage!=='league'))){let h=node('input',null,row),a=node('input',null,row);for(let x of [h,a]){x.type='number';x.min=0;x.step=1;x.className='score'}h.value=m.home_score??'';a.value=m.away_score??'';let b=node('button','Save result',row);b.onclick=()=>action(async()=>{let x=Number(h.value),y=Number(a.value);if(h.value===''||a.value===''||!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0)throw Error('Enter valid scores');await saveResult(m,x,y)})}else node('p',complete(m)?`${m.home_score} – ${m.away_score}`:'Awaiting result',row);if(m.winner_team)node('p','Winner: '+name(m.winner_team),row)}
function render(){for(let [id,hide] of [['admin',!owner()],['createPanel',!user||recovering],['login',!!user||recovering],['logoutButton',!user||recovering],['resetPanel',!recovering],['tableSection',fmt()==='knockout'],['leagueSection',fmt()==='knockout']])el(id).classList.toggle('hidden',hide);el('summary').textContent=current?`${current.name} | ${current.team_count} teams | ${matches.filter(m=>!m.is_bye).length} fixtures | ${current.is_public?'Public':'Private'}`:'';renderStandings();let editor=el('teamEditor');editor.replaceChildren();if(owner())for(let t of teams){let l=node('label',`${t.team_number}${t.group_name?' · '+t.group_name:''} `,editor);let i=node('input',null,l);i.id='team-'+t.team_number;i.value=t.name}let league=el('fixtures'),ko=el('knockouts');league.replaceChildren();ko.replaceChildren();let last='';for(let m of matches.filter(m=>m.stage==='league').sort((a,b)=>a.matchday-b.matchday||a.match_number-b.match_number)){let title='Matchday '+m.matchday;if(title!==last){node('h3',title,league);last=title}renderMatch(m,league)}last='';for(let m of matches.filter(m=>m.stage!=='league')){if(m.stage!==last){node('h3',m.stage.toUpperCase(),ko);last=m.stage}renderMatch(m,ko)}let final=matches.find(m=>m.stage==='final');el('champion').textContent=final?.winner_team?'🏆 CHAMPION: '+name(final.winner_team):fmt()==='round_robin'&&matches.length&&matches.every(complete)?'League winner: '+name(ranking()[0].n):'';el('drawButton').disabled=!owner()||!!matches.length;el('knockoutButton').disabled=!owner()||!['groups','champions_league'].includes(fmt())||!matches.length||matches.some(m=>m.stage!=='league'||!complete(m));}
async function pages(table,filter,order){let all=[];for(let i=0;;i+=500){let q=db.from(table).select('*');if(filter)q=q.eq('competition_id',filter);let part=check(await q.order(order).range(i,i+499));all.push(...part);if(part.length<500)return all}}
let loadVersion = 0;

async function load(id) {
    const version = ++loadVersion;

    let nextCurrent = null;
    let nextTeams = [];
    let nextMatches = [];

    if (id) {
        nextCurrent = check(await db
            .from('live_competitions')
            .select('*')
            .eq('id', id)
            .single());

        nextTeams = await pages(
            'live_teams', id, 'team_number'
        );

        nextMatches = await pages(
            'live_fixtures', id, 'match_number'
        );
    }

    if (version !== loadVersion) return;

    current = nextCurrent;
    teams = nextTeams;

    matches = [...new Map(
        nextMatches.map(m => [m.id, m])
    ).values()].sort(
        (a, b) => a.match_number - b.match_number
    );

    render();
}async function list(preferred){let rows=await pages('live_competitions',null,'created_at');rows.reverse();let s=el('competition');s.replaceChildren();for(let c of rows){let o=node('option',c.name+(c.is_public?'':' (Private)'),s);o.value=c.id}let id=rows.some(c=>c.id===preferred)?preferred:rows[0]?.id;if(id)s.value=id;await load(id)}
function fields(){let f=el('format').value;for(let [id,show] of [['gamesLabel',f==='champions_league'],['qualLabel',f==='champions_league'],['groupLabel',f==='groups'],['perLabel',f==='groups'],['doubleLabel',f==='round_robin']])el(id).classList.toggle('hidden',!show)}el('format').onchange=fields;fields();
function bracket(ids,start){let size=2**Math.ceil(Math.log2(ids.length)),order=[1,2];while(order.length<size){let s=order.length*2+1;order=order.flatMap(x=>[x,s-x])}let slots=order.map(i=>ids[i-1]??null),rows=[],previous=[],num=start;for(let r=1;slots.length>1||previous.length>1;r++){let count=r===1?slots.length/2:previous.length/2,next=[];for(let i=0;i<count;i++){let h=r===1?slots[i*2]:null,a=r===1?slots[i*2+1]:null,bye=r===1&&(!h||!a);let stage=count===1?'final':count===2?'semi-final':count===4?'quarter-final':'round-of-'+count*2;let m={competition_id:current.id,match_number:num++,stage,knockout_round:r,home_team:h,away_team:a,home_source_match:r===1?null:previous[i*2],away_source_match:r===1?null:previous[i*2+1],is_bye:bye,winner_team:bye?h||a:null};rows.push(m);next.push(m.match_number)}previous=next;slots=[]}return rows}
async function insertFixtures(rows){check(await db.from('live_fixtures').insert(rows))}
async function advance() {
    if (!owner()) return;

    let map = new Map(
        matches.map(m => [m.match_number, m])
    );

    for (let m of matches.filter(m => m.stage !== 'league')) {
        let sources = [
            m.home_source_match,
            m.away_source_match
        ];

        if (!sources[0] && !sources[1] &&
            current.team_count === 26 &&
            current.qualifiers === 8) {
            sources = ({
                57: [53, 54],
                58: [55, 56],
                59: [57, 58]
            })[m.match_number] || sources;
        }

        let h = map.get(sources[0])?.winner_team;
        let a = map.get(sources[1])?.winner_team;

        let updates = {};

        if (h && m.home_team == null) {
            updates.home_team = h;
        }

        if (a && m.away_team == null) {
            updates.away_team = a;
        }

        if (Object.keys(updates).length) {
            check(await db.from('live_fixtures')
                .update(updates)
                .eq('id', m.id));

            Object.assign(m, updates);
        }
    }
}async function saveResult(m,h,a){if(!owner())return;let w=null;if(m.stage!=='league'){if(h===a){let p=prompt('Penalty winner: 1 for '+name(m.home_team)+' or 2 for '+name(m.away_team));if(!['1','2'].includes(p))return;w=p==='1'?m.home_team:m.away_team}else w=h>a?m.home_team:m.away_team;if(m.winner_team&&m.winner_team!==w)throw Error('Changing confirmed knockout winners is disabled')}let id=current.id;check(await db.from('live_fixtures').update({home_score:h,away_score:a,winner_team:w}).eq('id',m.id));await load(id);await advance();await load(id);message('Result saved')}
function wire(){el('competition').onchange=()=>action(()=>load(el('competition').value));el('loginButton').onclick=()=>action(async()=>{user=check(await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value})).user;el('password').value='';await list(current?.id);message('Logged in')});el('logoutButton').onclick=()=>action(async()=>{check(await db.auth.signOut());user=null;await list(current?.id);message('Logged out')});el('forgotButton').onclick=()=>action(async()=>{if(!el('email').value.trim())throw Error('Enter email first');check(await db.auth.resetPasswordForEmail(el('email').value.trim(),{redirectTo:location.origin}));message('Recovery email sent')});el('resetButton').onclick=()=>action(async()=>{if(!recovering)throw Error('Open a valid recovery link');let p=el('newPassword').value;if(p.length<8||p!==el('confirmPassword').value)throw Error('Passwords must match and contain at least 8 characters');check(await db.auth.updateUser({password:p}));check(await db.auth.signOut());recovering=false;user=null;await list();message('Password changed. Log in again')});
el('createButton').onclick=()=>action(async()=>{if(!user||recovering)return;let name=el('competitionName').value.trim(),n=Number(el('teamCount').value),f=el('format').value,g=Number(el('games').value),q=Number(el('qualifiers').value),groups=Number(el('groups').value),per=Number(el('perGroup').value);if(!name||!Number.isInteger(n)||n<4||n>64)throw Error('Enter name and 4–64 teams');if(f==='champions_league'&&(!Number.isInteger(g)||g<1||g>=n||n*g%2||!power(q)||q>n))throw Error('Invalid matches or qualifiers; odd team counts require even matches per team');if(f==='groups'&&(!Number.isInteger(groups)||groups<2||!Number.isInteger(per)||per<1||Math.floor(n/groups)<Math.max(2,per)||!power(groups*per)))throw Error('Groups need at least two teams each and total qualifiers must be a power of two');let c=check(await db.from('live_competitions').insert({name,owner_id:user.id,team_count:n,format:f,games_per_team:f==='champions_league'?g:f==='round_robin'?(n-1)*(el('double').checked?2:1):0,qualifiers:f==='groups'?groups*per:f==='champions_league'?q:f==='knockout'?n:0,group_count:f==='groups'?groups:null,qualifiers_per_group:f==='groups'?per:null,double_round_robin:f==='round_robin'&&el('double').checked,is_public:el('public').checked}).select().single());try{check(await db.from('live_teams').insert(Array.from({length:n},(_,i)=>({competition_id:c.id,team_number:i+1,name:'Team '+String(i+1).padStart(2,'0')}))))}catch(e){await db.from('live_competitions').delete().eq('id',c.id);throw e}await list(c.id);message('Competition created')});
el('saveTeams').onclick=()=>action(async()=>{if(!owner())return;let rows=teams.map(t=>({...t,name:el('team-'+t.team_number).value.trim()}));if(rows.some(t=>!t.name))throw Error('All teams need names');check(await db.from('live_teams').upsert(rows));await load(current.id);message('Team names saved')});
el('drawButton').onclick=()=>action(async()=>{if(!owner()||matches.length)return;if(teams.length!==current.team_count)throw Error('Team count mismatch');let ids=teams.map(t=>t.team_number),rows=[],number=1;let add=(rs,group=null)=>rs.forEach((pairs,i)=>pairs.forEach(([h,a])=>rows.push({competition_id:current.id,match_number:number++,matchday:i+1,stage:'league',home_team:h,away_team:a,group_name:group})));if(fmt()==='knockout')rows=bracket(shuffle(ids),1);else if(fmt()==='champions_league')add(leagueDraw(ids,current.games_per_team));else if(fmt()==='round_robin'){let r=rounds(shuffle(ids));if(current.double_round_robin)r=r.concat(r.map(p=>p.map(([h,a])=>[a,h])));add(r)}else if(fmt()==='groups'){let assigned=shuffle([...teams]).map((t,i)=>({...t,group_name:'Group '+(i%current.group_count+1)}));check(await db.from('live_teams').upsert(assigned));for(let i=1;i<=current.group_count;i++){let group='Group '+i;add(rounds(assigned.filter(t=>t.group_name===group).map(t=>t.team_number)),group)}}else throw Error('Unknown format');await insertFixtures(rows);await load(current.id);await advance();await load(current.id);message('Fixtures generated')});
el('knockoutButton').onclick=()=>action(async()=>{if(!owner()||el('knockoutButton').disabled)return;let ids;if(fmt()==='groups'){let rankings=groupNames().map(g=>ranking(g));ids=[];for(let i=0;i<current.qualifiers_per_group;i++)for(let r of rankings)ids.push(r[i].n)}else ids=ranking().slice(0,current.qualifiers).map(r=>r.n);await insertFixtures(bracket(ids,Math.max(...matches.map(m=>m.match_number))+1));await load(current.id);message('Knockouts generated')});}
async function start(){try{if(!SUPABASE_URL.startsWith('https://')||SUPABASE_KEY.startsWith('YOUR_'))throw Error('Insert your Supabase URL and publishable key in index.html');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);wire();db.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){recovering=true;user=null;render();message('Enter new password')}});let session=check(await db.auth.getSession());user=recovering?null:session.session?.user||null;await list();setInterval(()=>{if(!busy&&!user&&!recovering)action(()=>list(current?.id))},10000)}catch(e){message(e.message)}}start();
